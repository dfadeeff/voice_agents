<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanzlei KI-Empfang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="page">
    <div class="layout">

      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <div class="logo-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l-1.912 5.813a2 2 0 01-1.275 1.275L3 12l5.813 1.912a2 2 0 011.275 1.275L12 21l1.912-5.813a2 2 0 011.275-1.275L21 12l-5.813-1.912a2 2 0 01-1.275-1.275L12 3z"/>
            </svg>
          </div>
          <div>
            <p class="header-name">Empfang</p>
            <p class="header-role">KI-Sprachassistent</p>
          </div>
        </div>
        <div class="status-pill" id="status-pill">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-label">Bereit</span>
        </div>
      </header>

      <!-- Hero title -->
      <section class="hero">
        <h1 class="hero-title">Gespräch</h1>
        <p class="hero-sub">Live-Transkription zwischen Anrufer und KI-Assistent</p>
      </section>

      <!-- Card -->
      <section class="card">
        <!-- Toolbar -->
        <div class="card-toolbar">
          <div class="toolbar-left">
            <div class="viz" id="viz">
              <div class="viz-ring" id="viz-ring"></div>
              <div class="viz-inner">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>
            <div>
              <p class="toolbar-title" id="toolbar-title">Bereit zum Telefonieren</p>
              <p class="toolbar-meta" id="toolbar-meta"><span id="msg-count">0</span> Nachrichten &bull; <span id="timer">—</span></p>
            </div>
          </div>
          <button class="mic-btn" id="mic-btn" disabled>
            <svg class="mic-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
            Mikro an
          </button>
        </div>

        <!-- Transcript -->
        <div class="transcript" id="transcript">
          <!-- Messages injected here by JS -->
        </div>

        <!-- Controls -->
        <div class="card-controls">
          <button class="call-btn" id="call-btn" onclick="toggleCall()">
            <svg class="call-btn-svg" id="btn-icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
            </svg>
            <span id="btn-label">Anruf starten</span>
          </button>
        </div>
      </section>

      <footer class="footer">Lokale Verarbeitung &middot; Keine Daten verlassen Ihren Rechner</footer>
    </div>
  </main>

  <script src="/static/components/protobuf.js"></script>
  <script src="/static/components/audio.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
