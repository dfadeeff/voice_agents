<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanzlei Sprachassistent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Kanzlei Sprachassistent</h1>
      <p class="subtitle">KI-Empfang</p>
    </header>

    <div class="call-panel">
      <div id="status" class="status idle">Bereit</div>

      <div id="transcript" class="transcript">
        <div class="transcript-placeholder">
          Klicken Sie auf den Button, um einen Anruf mit unserer KI-Empfangskraft zu starten.
        </div>
      </div>

      <div class="controls">
        <button id="call-btn" class="call-btn" onclick="toggleCall()">
          <span class="btn-icon" id="btn-icon">📞</span>
          <span id="btn-label">Anruf starten</span>
        </button>
      </div>
    </div>
  </div>

  <script src="/static/components/protobuf.js"></script>
  <script src="/static/components/audio.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
