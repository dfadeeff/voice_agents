[project]
name = "voice-agent"
version = "0.1.0"
description = "Inbound voice AI agent for a law firm"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pipecat-ai[whisper,piper,silero,websocket]>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
cloud = [
    "pipecat-ai[deepgram,openai,elevenlabs]>=1.3.0,<2.0.0",
    "twilio>=9.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]