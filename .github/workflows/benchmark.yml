name: Model Benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Models to benchmark (space-separated, empty = qwen2.5:7b)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ollama
        run: |
          brew install ollama
          ollama serve &
          sleep 10

      - name: Pull model
        run: ollama pull qwen2.5:7b

      - name: Run benchmark
        working-directory: backend
        run: |
          MODELS="${{ github.event.inputs.models }}"
          if [ -n "$MODELS" ]; then
            python3 scripts/benchmark_models.py $MODELS
          else
            python3 scripts/benchmark_models.py qwen2.5:7b
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/
