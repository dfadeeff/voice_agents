name: Model Benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Models to benchmark (space-separated, empty = all installed)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'scripts/benchmark_models.py'
      - 'backend/app/conversation/prompts.py'
      - 'backend/app/tools/**'

jobs:
  benchmark:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ollama
        run: |
          brew install ollama
          ollama serve &
          sleep 5

      - name: Pull default model
        run: ollama pull qwen3:4b

      - name: Run benchmark
        run: |
          MODELS="${{ github.event.inputs.models }}"
          if [ -n "$MODELS" ]; then
            python3 scripts/benchmark_models.py $MODELS
          else
            python3 scripts/benchmark_models.py qwen3:4b
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/

      - name: Comment on commit
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const md = fs.readFileSync('benchmarks/benchmark_results.md', 'utf8');
            const summary = md.split('\n').slice(0, 30).join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `## Benchmark Results\n\n${summary}\n\n<details><summary>Full report</summary>\n\n${md}\n</details>`
            });
